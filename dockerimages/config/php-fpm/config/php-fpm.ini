; PHP runtime tuned for Magento 2 development.
memory_limit = 4G
max_execution_time = 18000
date.timezone = "Europe/Rome"
upload_max_filesize = 128M
post_max_size = 128M
zlib.output_compression = On
log_errors = On
display_errors = On
output_buffering = 65535

realpath_cache_size = 10M
realpath_cache_ttl = 7200
max_input_vars = 75000
session.gc_probability = 1

; --- MailHog ---
; sendmail-mailhog is a shim around mhsendmail that accepts the classic
; sendmail flags. "-t -i" is required by Symfony Mailer (Magento >= 2.4.8,
; MageOS 2.x / 3.x), which rejects a sendmail_path without -t/-bs; "-i" also
; stops Symfony from dot-stuffing lines (SMTP already does it). PHP mail()
; on older releases keeps working through the same shim. See bin/sendmail-mailhog.
sendmail_path = "/usr/local/bin/sendmail-mailhog -t -i"

; --- OPcache (developer-friendly: revalidate, but only when touched) ---
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 1024
opcache.max_accelerated_files = 130000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.revalidate_path = 1
opcache.consistency_checks = 0
opcache.interned_strings_buffer = 32
opcache.fast_shutdown = 1
opcache.save_comments = 1
